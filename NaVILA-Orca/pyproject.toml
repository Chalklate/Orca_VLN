[build-system]
requires = ["setuptools>=69,<82", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "navvlm-orcalab"
version = "0.1.0"
description = "Self-contained NavVLM automatic-navigation example for OrcaLab"
requires-python = ">=3.10"
dependencies = [
  "grpcio==1.66.1",
  "numpy==2.2.6",
  "Pillow==12.0.0",
]

[project.optional-dependencies]
voice = [
  "google-auth>=2.14.1",
]
bedrock = [
  "boto3>=1.35.0,<2",
]
openai = [
  "openai>=1.0.0,<2",
]
orca = [
  "av==18.0.0",
  "opencv-python==5.0.0.93",
  "orca-gym==26.7.1",
  "orca-lab==26.7.1",
  "mjlab==1.2.0",
  "mujoco-warp==3.5.0",
  "rsl-rl-lib==5.0.1",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "websockets==16.1.1",
]
test = ["pytest==9.1.1"]

[project.scripts]
navvlm-orcalab = "navila_orca.cli:main"
navvlm-orcalab-render-server = "navila_orca.render.grpc_bridge:server_main"
navila-memory-guide = "navila_orca.memory_guide:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navila_orca = [
  "assets/checkpoints/*.pt",
  "go2_task/assets/robots/unitree_go2/xmls/*.xml",
  "go2_task/assets/robots/unitree_go2/xmls/assets/*.obj",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
